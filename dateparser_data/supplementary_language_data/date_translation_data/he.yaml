relative-type-regex:
    \1 day ago:
        - לפני (\d+[.,]?\d*) ימ׳
    in \1 day:
        - בעוד (\d+[.,]?\d*) ימ׳
sentence_splitter_group: 1

skip: ["ב-", "בסביבות", "בערך", "בקירוב", "בשעה", "ה-"]

monday:
    - שני
    - יום ב
tuesday:
    - שלישי
    - יום ג
wednesday:
    - רביעי
    - יום ד
thursday:
    - חמישי
    - יום ה
friday:
    - שישי
    - יום ו
sunday:
    - ראשון
    - יום א

january:
    - לינואר
    - בינואר
    - ינו
february:
    - בפברואר
    - לפברואר
    - פבר
march:
    - במרץ
    - למרץ
    - מרס
    - במרס
    - למרס
    - מארס
    - במארס
    - למארס
april:
    - באפריל
    - לאפריל
    - אפר
may:
    - במאי
    - למאי
june:
    - ביוני
    - ליוני
    - יונ
july:
    - ביולי
    - ליולי
    - יול
august:
    - באוגוסט
    - לאוגוסט
    - אוג
september:
    - בספטמבר
    - לספטמבר
    - ספט
october:
    - באוקטובר
    - לאוקטובר
    - אוק
november:
    - בנובמבר
    - לנובמבר
    - נוב
december:
    - בדצמבר
    - לדצמבר
    - דצמ

year:
    - שנים
    - בשנה
month:
    - חודשים
    - בחודש
week:
    - שבועות
day:
    - ימים
    - ביום
hour:
    - שעות
minute:
    - דקות
second:
    - שניה
    - שניות

ago:
    - לפני
in:
    - בעוד
    - עוד

simplifications:
    - ויום: 1 יום
    - ושבוע: 1 שבוע
    - וחודש: 1 חודש
    - ושנה: 1 שנה
    - ו(\w+): \1
    - שנתיי?ם: 2 שנים
    - חודשיים: 2 חודשים
    - שבועיי?ם: 2 שבועות
    - יומיי?ם: 2 ימים
    - שעתיי?ם: 2 שעות
    - שלשום: 2 ימים
    - מחר: בעוד 1 יום
    - אחר חצות: am
    - חצות: 12 am
    - לפנות בוקר: am
    - בבוקר: am
    - בצהריי?ם: pm
    - אחרי ה?צהריי?ם: pm
    - אחה"צ: pm
    - לפנות ערב: pm
    - בערב: pm

    # The numeral "1" is optional: a bare unit means "1 unit" ago
    - '(?<=לפני\s+)שבוע\b(?!\s+ה)(?!\s+\d)': '1 שבוע'
    - '(?<=לפני\s+)חודש\b(?!\s+ה)(?!\s+(?:באוקטובר|לאוקטובר|אוקטובר|באוגוסט|בנובמבר|בספטמבר|בפברואר|לאוגוסט|לנובמבר|לספטמבר|לפברואר|אוגוסט|באפריל|בדצמבר|בינואר|לאפריל|לדצמבר|לינואר|נובמבר|ספטמבר|פברואר|אפריל|ביולי|ביוני|במארס|דצמבר|ינואר|ליולי|ליוני|למארס|אוג׳|אוק׳|אפר׳|במאי|במרס|במרץ|דצמ׳|יולי|יוני|ינו׳|למאי|למרס|למרץ|מארס|נוב׳|ספט׳|פבר׳|אוג|אוק|אפר|דצמ|יול|יונ|ינו|מאי|מרס|מרץ|נוב|ספט|פבר|\d))': '1 חודש'
    - '(?<=לפני\s+)שנה\b(?!\s+ה)(?!\s+\d)': '1 שנה'
    # Not before another word: "יום הולדת" (birthday) and "יום כיפור" are not "a day"
    - '(?<=לפני\s+)יום\b(?!\s+(?:[א-ת]|\d))': '1 יום'
    - '(?<=לפני\s+)שעה\b(?!\s+ה)(?!\s+\d)': '1 שעה'
    - '(?<=לפני\s+)דקה\b(?!\s+ה)(?!\s+\d)': '1 דקה'
