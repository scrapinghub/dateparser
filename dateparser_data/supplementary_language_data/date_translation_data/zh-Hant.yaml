locale_specific:
    zh-Hant-HK:
        relative-type:
            1 month ago:
                - 上月
            in 1 month:
                - 下月
        relative-type-regex:
            \1 week ago:
                - (\d+[.,]?\d*)週前
            in \1 week:
                - (\d+[.,]?\d*)週後
    zh-Hant-MO:
        relative-type:
            1 month ago:
                - 上月
            in 1 month:
                - 下月
        relative-type-regex:
            \1 week ago:
                - (\d+[.,]?\d*)週前
            in \1 week:
                - (\d+[.,]?\d*)週後
no_word_spacing: "True"

sentence_splitter_group: 4

skip: ["約"]

monday:
    - 禮拜一
tuesday:
    - 禮拜二
wednesday:
    - 禮拜三
thursday:
    - 禮拜四
friday:
    - 禮拜五
saturday:
    - 禮拜六
sunday:
    - 星期天
    - 禮拜日
    - 禮拜天

minute:
    - 分
month:
    - 個月
week:
    - 星期
day:
    - 天

ago:
    - 前
in:
    - 在

relative-type:
    2 day ago:
        - 前天
    0 second ago:
        - 剛剛
    0 hour ago:
        - 這一時間
        - 此時
    in 2 days:
        - 後天

simplifications:
    - 半小時前: 30分前
    - (?:中午|下午|(?:晚上?))(?:\s*)(\d+[.,]?\d*)(?:\s*):(?:\s+|:)?(\d+[.,]?\d*): \1:\2 pm
    - (?:上午|早上|凌晨)(?:\s*)(\d+[.,]?\d*)(?:\s*):(?:\s+|:)?(\d+[.,]?\d*): \1:\2 am
    - 中午: '12:00'
    - (\d+[.,]?\d*)年(?:\s+)?(\d+[.,]?\d*)月(?:\s+)?(\d+[.,]?\d*)日(?:\s+)?(\d+[.,]?\d*)時(?:\s+)?(\d+[.,]?\d*)分: \1-\2-\3 \4:\5
    - (\d+[.,]?\d*)年(?:\s+)?(\d+[.,]?\d*)月(?:\s+)?(\d{1,2})(?:日)?(?:\s+)?(\d{1,2})(?:點|:)(\d{1,2}): \1-\2-\3 \4:\5
    - (\d+[.,]?\d*)年(?:\s+)?(\d+[.,]?\d*)月(?:\s+)?(\d{1,2})(?:日)?: \1-\2-\3
    - (\d+[.,]?\d*)月(?=.*[前後]): \1 月
