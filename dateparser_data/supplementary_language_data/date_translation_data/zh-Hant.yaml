locale_specific:
    zh-Hant-HK:
        relative-type:
            1 month ago:
                - 上月
            in 1 month:
                - 下月
        relative-type-regex:
            \1 week ago:
                - (\d+[.,]?\d*)週前
            in \1 week:
                - (\d+[.,]?\d*)週後
    zh-Hant-MO:
        relative-type:
            1 month ago:
                - 上月
            in 1 month:
                - 下月
        relative-type-regex:
            \1 week ago:
                - (\d+[.,]?\d*)週前
            in \1 week:
                - (\d+[.,]?\d*)週後
no_word_spacing: "True"

sentence_splitter_group: 4

skip: ["大約", "約", "後天性"]

monday:
    - 禮拜一
tuesday:
    - 禮拜二
wednesday:
    - 禮拜三
thursday:
    - 禮拜四
friday:
    - 禮拜五
saturday:
    - 禮拜六
sunday:
    - 星期天
    - 禮拜日
    - 禮拜天

minute:
    - 分
month:
    - 個月
week:
    - 星期
day:
    - 天

ago:
    - 前

relative-type:
    3 day ago:
        - 大前天
    2 day ago:
        - 前天
    0 second ago:
        - 剛剛
    0 hour ago:
        - 這一時間
        - 此時
    in 2 day:
        - 後天
    in 3 day:
        - 大後天

simplifications:
    # Chinese numeral dates.
    # Years are written digit by digit (二〇一七 -> 2017); the lookahead
    # is bounded to 4-digit years followed by a month.
    - 〇(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '0'
    - 零(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '0'
    - 一(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '1'
    - 二(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '2'
    - 三(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '3'
    - 四(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '4'
    - 五(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '5'
    - 六(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '6'
    - 七(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '7'
    - 八(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '8'
    - 九(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '9'
    # Day of month 1-31, only after 月. Longest forms first so that
    # 二十一 is not reduced to 二十 / 一.
    - (?<=月)三十一日: 31日
    - (?<=月)三十日: 30日
    - (?<=月)二十九日: 29日
    - (?<=月)二十八日: 28日
    - (?<=月)二十七日: 27日
    - (?<=月)二十六日: 26日
    - (?<=月)二十五日: 25日
    - (?<=月)二十四日: 24日
    - (?<=月)二十三日: 23日
    - (?<=月)二十二日: 22日
    - (?<=月)二十一日: 21日
    - (?<=月)二十日: 20日
    - (?<=月)十九日: 19日
    - (?<=月)十八日: 18日
    - (?<=月)十七日: 17日
    - (?<=月)十六日: 16日
    - (?<=月)十五日: 15日
    - (?<=月)十四日: 14日
    - (?<=月)十三日: 13日
    - (?<=月)十二日: 12日
    - (?<=月)十一日: 11日
    - (?<=月)十日: 10日
    - (?<=月)九日: 9日
    - (?<=月)八日: 8日
    - (?<=月)七日: 7日
    - (?<=月)六日: 6日
    - (?<=月)五日: 5日
    - (?<=月)四日: 4日
    - (?<=月)三日: 3日
    - (?<=月)二日: 2日
    - (?<=月)一日: 1日
    # Month names 1-12, only after 年, so a standalone 三月 still
    # resolves as a month name.
    - (?<=年)十二月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日): 12月
    - (?<=年)十一月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日): 11月
    - (?<=年)十月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日): 10月
    - (?<=年)九月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日): 9月
    - (?<=年)八月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日): 8月
    - (?<=年)七月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日): 7月
    - (?<=年)六月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日): 6月
    - (?<=年)五月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日): 5月
    - (?<=年)四月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日): 4月
    - (?<=年)三月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日): 3月
    - (?<=年)二月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日): 2月
    - (?<=年)一月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日): 1月
    - 半小時前: 30分前
    - (?:中午|下午|(?:晚上?))(?:\s*)(\d+[.,]?\d*)(?:\s*):(?:\s+|:)?(\d+[.,]?\d*(?::\d+[.,]?\d*)?): \1:\2 pm
    - (?:上午|早上|凌晨)(?:\s*)(\d+[.,]?\d*)(?:\s*):(?:\s+|:)?(\d+[.,]?\d*(?::\d+[.,]?\d*)?): \1:\2 am
    - 中午: '12:00'
    - (\d+[.,]?\d*)\s*年\s*(\d+[.,]?\d*)\s*月\s*(\d+[.,]?\d*)\s*日\s*(\d+[.,]?\d*)\s*時\s*(\d+[.,]?\d*)\s*分: \1-\2-\3 \4:\5
    - (\d+[.,]?\d*)\s*年\s*(\d+[.,]?\d*)\s*月\s*(\d{1,2})\s*(?:日\s*)?(\d{1,2})\s*(?:點|:)\s*(\d{1,2}): \1-\2-\3 \4:\5
    - (\d+[.,]?\d*)\s*年\s*(\d+[.,]?\d*)\s*月\s*(\d{1,2})\s*(?:日)?: \1-\2-\3
    - (\d+[.,]?\d*)月(?=[前後]): \1 月
