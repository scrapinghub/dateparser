    - 지금부터

relative-type:
    0 day ago:
        - 금일
    0 week ago:
        - 금주
    0 month ago:
        - 이달
    0 year ago:
        - 금년
    1 day ago:
        - 작일
    2 day ago:
        - 그저께
        - 그제
    in 1 day:
        - 명일

relative-type-regex:
    \1 year ago:
        - (\d+[.,]?\d*)년전
    \1 month ago:
        - (\d+[.,]?\d*)개월전
        - (\d+[.,]?\d*)달 전
    \1 week ago:
        - (\d+[.,]?\d*)주전
    \1 day ago:
        - (\d+[.,]?\d*)일전
    \1 hour ago:
        - (\d+[.,]?\d*)시간전
    \1 minute ago:
        - (\d+[.,]?\d*)분전
    \1 second ago:
        - (\d+[.,]?\d*)초전
    in \1 year:
        - (\d+[.,]?\d*)년후
    in \1 month:
        - (\d+[.,]?\d*)개월후
        - (\d+[.,]?\d*)달 후
    in \1 week:
        - (\d+[.,]?\d*)주후
    in \1 day:
        - (\d+[.,]?\d*)일후
    in \1 hour:
        - (\d+[.,]?\d*)시간후
    in \1 minute:
        - (\d+[.,]?\d*)분후
    in \1 second:
        - (\d+[.,]?\d*)초후
