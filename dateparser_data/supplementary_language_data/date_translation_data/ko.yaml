relative-type:
    0 day ago:
        - 금일
    1 day ago:
        - 작일
    in 1 day:
        - 명일

relative-type-regex:
    \1 month ago:
        - (\d+[.,]?\d*)달 전
    in \1 month:
        - (\d+[.,]?\d*)달 후

simplifications:
    - ([^\W_]*?(?<!\d)(?:\d+월(?:\s*\d+일)?|\d+시(?:\s*\d+분(?:\s*\d+초)?)?|(?<!:)\d+(?::\d\d)+)|반)(?:에는|에도|에서|부터는|까지는|부터|까지|으로|경|쯤|께|에|의|은|는|이|가|로|와|과): \1
    - (오전|오후)(\d\w*): \1 \2
    - (\d{4})년\s*0?(\d+월\w*): \1 \2
    - (\d+월\s*\d+일)\((월|화|수|목|금|토|일)\): \1 (\2)
    - 0?(\d+월)\s*(\d+)일: \1 \2
    - 0(\d월): \1
    - (\d+)시\s*(\d+)분\s*(\d+)초: \1:\2:\3
    - (\d+)시\s*(\d+)분: \1:\2
    - (\d+)시\s*반: \1:30
    - (\d+)시: \1:00
