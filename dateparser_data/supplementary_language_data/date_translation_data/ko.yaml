relative-type:
    0 day ago:
        - 금일
    1 day ago:
        - 작일
    in 1 day:
        - 명일

relative-type-regex:
    \1 month ago:
        - (\d+[.,]?\d*)달 전
    in \1 month:
        - (\d+[.,]?\d*)달 후


simplifications:
    - (\d+)년\s*(\d+월): \1 \2
    - (\d+월)\s*(\d+)일: \1 \2
    - (\d+)시\s*(\d+)분\s*(\d+)초: \1:\2:\3
    - (\d+)시\s*(\d+)분: \1:\2
    - (\d+)시(?!간): \1:00
    - (오전|오후)\s*(\d+:\d+(?::\d+)?): \2 \1
