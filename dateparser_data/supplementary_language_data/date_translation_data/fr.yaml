relative-type-regex:
    \1 hour ago:
        - il y a (\d+[.,]?\d*)h
    \1 minute ago:
        - il y a (\d+[.,]?\d*)min
    in \1 hour:
        - dans (\d+[.,]?\d*)h
skip: ["environ", "er", "et", "le", "à"]

sentence_splitter_group: 1

monday:
    - lu
tuesday:
    - ma
wednesday:
    - me
thursday:
    - je
friday:
    - ve
saturday:
    - sa
sunday:
    - di

january:
    - jan
february:
    - fév
june:
    - jun
july:
    - jul
august:
    - aoû
september:
    - sep

year:
    - années
    - ans
week:
    - semaines
day:
    - jours
hour:
    - heures
minute:
    - minutes
second:
    - secondes

ago:
    - il ya
    - il y a
in:
    - dans
    - en
    - après

relative-type:
    2 day ago:
        - avant-hier
    in 2 day:
        - après-demain

simplifications:
    - d'une: '1'
    - d'un: '1'
    - une: '1'
    - un: '1'
    - (\d+[.,]?\d*)\s+h\s+(\d+[.,]?\d*)\s+min: \1h\2m
    - (\d+[.,]?\d*)h(\d+[.,]?\d*)m?: \1:\2
    - moins\s(?:de\s)?(\d+[.,]?\d*)\s?(minute|seconde|heure): \1 \2
    - moins\s(?:de\s)?(\d+[.,]?\d*)\s?s: \1 seconde
    - moins\s(?:de\s)?(\d+[.,]?\d*)\s?m: \1 minute
    - moins\s(?:de\s)?(\d+[.,]?\d*)\s?h: \1 heure
    - deux: '2'
    - trois: '3'
    - quatre: '4'
    - cinq: '5'
    - six: '6'
    # 'sept' is both the abbreviation for 'septembre' and the word for 7,
    # and simplifications run before month names are translated. Only
    # simplify it to 7 where it is a quantity, i.e. followed by a duration
    # unit or a clock time. 'a' (for 'annee') counts as a unit only when no
    # number follows it, because the preposition 'a' loses its accent during
    # normalization and introduces a time, as in '3 sept a 14h30'.
    - 'sept(?=:\d|\s*(?:années|année|ans|an|semaines|semaine|sem|secondes|seconde|minutes|minute|min|mois|heures|heure|jours|jour|[jhms])\b|\s*a\b(?!\s*\d))': '7'
    - huit: '8'
    - neuf: '9'
    - dix: '10'
    - onze: '11'
    - douze: '12'
