no_word_spacing: "True"

sentence_splitter_group : 4

skip: ["大约", "约", "后天性"]

monday:
    - 礼拜一
tuesday:
    - 礼拜二
wednesday:
    - 礼拜三
thursday:
    - 礼拜四
friday:
    - 礼拜五
saturday:
    - 礼拜六
sunday:
    - 星期天
    - 礼拜日
    - 礼拜天

month:
    - 个月
week:
    - 星期
day:
    - 天

ago:
    - 前

relative-type:
    3 day ago:
        - 大前天
    2 day ago:
        - 前天
    0 second ago:
        - 刚刚
    0 hour ago:
        - 这一时间
        - 此时
    in 2 day:
        - 后天
    in 3 day:
        - 大后天

simplifications:
    # Chinese numeral dates.
    # Years are written digit by digit (二〇一七 -> 2017); the lookahead
    # limits the substitution to digit clusters followed by 年 and a month.
    - 〇(?=[0-9〇零一二三四五六七八九]*年[0-9〇零一二三四五六七八九十]{1,2}月): '0'
    - 零(?=[0-9〇零一二三四五六七八九]*年[0-9〇零一二三四五六七八九十]{1,2}月): '0'
    - 一(?=[0-9〇零一二三四五六七八九]*年[0-9〇零一二三四五六七八九十]{1,2}月): '1'
    - 二(?=[0-9〇零一二三四五六七八九]*年[0-9〇零一二三四五六七八九十]{1,2}月): '2'
    - 三(?=[0-9〇零一二三四五六七八九]*年[0-9〇零一二三四五六七八九十]{1,2}月): '3'
    - 四(?=[0-9〇零一二三四五六七八九]*年[0-9〇零一二三四五六七八九十]{1,2}月): '4'
    - 五(?=[0-9〇零一二三四五六七八九]*年[0-9〇零一二三四五六七八九十]{1,2}月): '5'
    - 六(?=[0-9〇零一二三四五六七八九]*年[0-9〇零一二三四五六七八九十]{1,2}月): '6'
    - 七(?=[0-9〇零一二三四五六七八九]*年[0-9〇零一二三四五六七八九十]{1,2}月): '7'
    - 八(?=[0-9〇零一二三四五六七八九]*年[0-9〇零一二三四五六七八九十]{1,2}月): '8'
    - 九(?=[0-9〇零一二三四五六七八九]*年[0-9〇零一二三四五六七八九十]{1,2}月): '9'
    # Day of month 1-31, only after 月. Longest forms first so that
    # 二十一 is not reduced to 二十 / 一.
    - (?<=月)三十一([日号]): 31\1
    - (?<=月)三十([日号]): 30\1
    - (?<=月)二十九([日号]): 29\1
    - (?<=月)二十八([日号]): 28\1
    - (?<=月)二十七([日号]): 27\1
    - (?<=月)二十六([日号]): 26\1
    - (?<=月)二十五([日号]): 25\1
    - (?<=月)二十四([日号]): 24\1
    - (?<=月)二十三([日号]): 23\1
    - (?<=月)二十二([日号]): 22\1
    - (?<=月)二十一([日号]): 21\1
    - (?<=月)二十([日号]): 20\1
    - (?<=月)十九([日号]): 19\1
    - (?<=月)十八([日号]): 18\1
    - (?<=月)十七([日号]): 17\1
    - (?<=月)十六([日号]): 16\1
    - (?<=月)十五([日号]): 15\1
    - (?<=月)十四([日号]): 14\1
    - (?<=月)十三([日号]): 13\1
    - (?<=月)十二([日号]): 12\1
    - (?<=月)十一([日号]): 11\1
    - (?<=月)十([日号]): 10\1
    - (?<=月)九([日号]): 9\1
    - (?<=月)八([日号]): 8\1
    - (?<=月)七([日号]): 7\1
    - (?<=月)六([日号]): 6\1
    - (?<=月)五([日号]): 5\1
    - (?<=月)四([日号]): 4\1
    - (?<=月)三([日号]): 3\1
    - (?<=月)二([日号]): 2\1
    - (?<=月)一([日号]): 1\1
    # Month names 1-12, only after 年, so a standalone 三月 still
    # resolves as a month name.
    - (?<=年)十二月: 12月
    - (?<=年)十一月: 11月
    - (?<=年)十月: 10月
    - (?<=年)九月: 9月
    - (?<=年)八月: 8月
    - (?<=年)七月: 7月
    - (?<=年)六月: 6月
    - (?<=年)五月: 5月
    - (?<=年)四月: 4月
    - (?<=年)三月: 3月
    - (?<=年)二月: 2月
    - (?<=年)一月: 1月
    - 半小时前: 30分前
    - (?:中午|下午|(?:晚上?))(?:\s*)(\d+[.,]?\d*)(?:\s*):(?:\s+|:)?(\d+[.,]?\d*(?::\d+[.,]?\d*)?): \1:\2 pm
    - (?:上午|早上|凌晨)(?:\s*)(\d+[.,]?\d*)(?:\s*):(?:\s+|:)?(\d+[.,]?\d*(?::\d+[.,]?\d*)?): \1:\2 am
    - 中午: '12:00'
    - (\d+[.,]?\d*)\s*年\s*(\d+[.,]?\d*)\s*月\s*(\d+[.,]?\d*)\s*日\s*(\d+[.,]?\d*)\s*时\s*(\d+[.,]?\d*)\s*分: \1-\2-\3 \4:\5
    - (\d+[.,]?\d*)\s*年\s*(\d+[.,]?\d*)\s*月\s*(\d{1,2})\s*(?:日\s*)?(\d{1,2})\s*(?:点|:)\s*(\d{1,2}): \1-\2-\3 \4:\5
    - (\d+[.,]?\d*)\s*年\s*(\d+[.,]?\d*)\s*月\s*(\d{1,2})\s*(?:日)?: \1-\2-\3
    - (\d+[.,]?\d*)月(?=[前后]): \1 月
