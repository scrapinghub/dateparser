no_word_spacing: "True"

sentence_splitter_group : 4

skip: ["大约", "约", "后天性"]

monday:
    - 礼拜一
tuesday:
    - 礼拜二
wednesday:
    - 礼拜三
thursday:
    - 礼拜四
friday:
    - 礼拜五
saturday:
    - 礼拜六
sunday:
    - 星期天
    - 礼拜日
    - 礼拜天

month:
    - 个月
week:
    - 星期
day:
    - 天

ago:
    - 前

relative-type:
    3 day ago:
        - 大前天
    2 day ago:
        - 前天
    0 second ago:
        - 刚刚
    0 hour ago:
        - 这一时间
        - 此时
    in 2 day:
        - 后天
    in 3 day:
        - 大后天

simplifications:
    # Chinese numeral dates.
    # Years are written digit by digit (二〇一七 -> 2017); the lookahead
    # requires a full year-month-day date whose year has at least two
    # digits, so phrases like 一年十二月五日 stay untouched.
    - (?!(?<![0-9〇零一二三四五六七八九])〇(?=年))〇(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '0'
    - (?!(?<![0-9〇零一二三四五六七八九])零(?=年))零(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '0'
    - (?!(?<![0-9〇零一二三四五六七八九])一(?=年))一(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '1'
    - (?!(?<![0-9〇零一二三四五六七八九])二(?=年))二(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '2'
    - (?!(?<![0-9〇零一二三四五六七八九])三(?=年))三(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '3'
    - (?!(?<![0-9〇零一二三四五六七八九])四(?=年))四(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '4'
    - (?!(?<![0-9〇零一二三四五六七八九])五(?=年))五(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '5'
    - (?!(?<![0-9〇零一二三四五六七八九])六(?=年))六(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '6'
    - (?!(?<![0-9〇零一二三四五六七八九])七(?=年))七(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '7'
    - (?!(?<![0-9〇零一二三四五六七八九])八(?=年))八(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '8'
    - (?!(?<![0-9〇零一二三四五六七八九])九(?=年))九(?=[0-9〇零一二三四五六七八九]{0,3}年[0-9〇零一二三四五六七八九十]{1,2}月(?=[0-9]|[〇零一二三四五六七八九十]{1,3}日)): '9'
