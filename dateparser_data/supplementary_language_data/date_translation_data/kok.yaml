relative-type:
    0 day ago:
        - today
    0 hour ago:
        - this hour
    0 minute ago:
        - this minute
        - हें मिनीट
    0 month ago:
        - this month
    0 second ago:
        - now
    0 week ago:
        - this week
    0 year ago:
        - this year
    1 day ago:
        - yesterday
    1 month ago:
        - last month
    1 week ago:
        - last week
        - निमाणो सप्तक
    1 year ago:
        - last year
        - फाटलें वर्स
    in 1 day:
        - tomorrow
    in 1 month:
        - next month
    in 1 week:
        - next week
    in 1 year:
        - next year
november:
    - नो
relative-type-regex:
    \1 hour ago:
        - (\d+[.,]?\d*) वरा आदीं
    \1 minute ago:
        - (\d+[.,]?\d*) मिन्टां आदीं
    \1 month ago:
        - (\d+[.,]?\d*) म्हयन्यां आदीं
    \1 second ago:
        - (\d+[.,]?\d*) से आदीं
        - (\d+[.,]?\d*) सेकंद आदीं
    \1 week ago:
        - (\d+[.,]?\d*) सप्त आदीं
    in \1 minute:
        - (\d+[.,]?\d*) मिन्टां
    in \1 second:
        - (\d+[.,]?\d*) सेकंदानीं
