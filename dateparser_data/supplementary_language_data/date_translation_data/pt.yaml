relative-type-regex:
    \1 minute ago:
        - há (\d+[.,]?\d*) mins
    in \1 minute:
        - em (\d+[.,]?\d*) mins
    in \1 second:
        - em (\d+[.,]?\d*) segs
skip: ["cerca", "de", "e", "às"]
pertain: ["de"]

sentence_splitter_group: 1

monday:
    - Segunda
tuesday:
    - Terça
wednesday:
    - Quarta
thursday:
    - Quinta
friday:
    - Sexta
saturday:
    - Sab

september:
    - Septembro

year:
    - anos
month:
    - meses
week:
    - semanas
day:
    - dias
hour:
    - horas
minute:
    - minutos
    - m
second:
    - segundos
    - s

early_morning:
    - de madrugada
    - na madrugada
    - pela madrugada
    - madrugada

ago:
    - atrás
    - há
in:
    - em

relative-type:
    2 day ago:
        - anteontem

simplifications:
    # "14h" and "14h30" are how a time of day is written in Portuguese;
    # read as a number followed by a unit they mean a duration instead, and
    # the result is 14 hours before the base date.
    - (?<!há )(?<!ha )(\d+[.,]?\d*)h(\d+[.,]?\d*)m?: '\1:\2'
    - (?<!há )(?<!ha )\b([01]?\d|2[0-3])h\b: '\1:00'
    - esta madrugada: hoje madrugada
    - uma: '1'
    - um: '1'
    - alguns segundos: 44 segundos
