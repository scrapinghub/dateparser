relative-type-regex:
    \1 week ago:
        - (\d+[.,]?\d*) வாரத்திற்கு முன்பு
    \1 hour ago:
        - (\d+[.,]?\d*) மணி முன்
    \1 second ago:
        - (\d+[.,]?\d*) விநா முன்
    in \1 hour:
        - (\d+[.,]?\d*) மணி
    in \1 second:
        - (\d+[.,]?\d*) விநா
am:
    - முற்பகல்
pm:
    - பிற்பகல்
hour:
    - மணி
    - மணிநேரங்கள்
second:
    - விநா
