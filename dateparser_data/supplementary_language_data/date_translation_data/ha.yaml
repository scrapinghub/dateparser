am:
    - am
pm:
    - pm
relative-type:
    0 hour ago:
        - this hour
    0 minute ago:
        - this minute
    0 month ago:
        - this month
    0 second ago:
        - now
    0 week ago:
        - this week
    0 year ago:
        - this year
    1 month ago:
        - last month
    1 week ago:
        - last week
    1 year ago:
        - last year
    in 1 month:
        - next month
    in 1 week:
        - next week
    in 1 year:
        - next year
relative-type-regex:
    \1 day ago:
        - kwanaki da suka gabata (\d+[.,]?\d*)
        - rana da ya gabata (\d+[.,]?\d*)
    \1 hour ago:
        - (\d+[.,]?\d*) awa da ya gabata
    \1 minute ago:
        - (\d+[.,]?\d*) minti da ya gabata
    \1 month ago:
        - watan da ya gabata (\d+[.,]?\d*)
    \1 second ago:
        - (\d+[.,]?\d*) dakika da ya gabata
    \1 week ago:
        - mako da suka gabata (\d+[.,]?\d*)
        - mako da ya gabata (\d+[.,]?\d*)
        - makonni da suka gabata (\d+[.,]?\d*)
    \1 year ago:
        - shekara da suka gabata (\d+[.,]?\d*)
    in \1 day:
        - a cikin rana (\d+[.,]?\d*)
    in \1 hour:
        - cikin (\d+[.,]?\d*) awa
    in \1 minute:
        - cikin (\d+[.,]?\d*) minti
    in \1 second:
        - cikin (\d+[.,]?\d*) dakika
