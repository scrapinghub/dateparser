    1 day ago:
        - اليوم السابق
        - الأمس
    2 day:
        - يومين
    2 hour:
        - ساعتين
    1 hour ago:
        - ساعة واحدة

simplifications:
    # The numeral "1" is optional: a bare unit means "1 unit" ago
    - '(?<=(قبل|منذ)\s+)أسبوع\b(?!\s+ال)': '1 أسبوع'
    - '(?<=(قبل|منذ)\s+)شهر\b(?!\s+ال)(?!\s+(?:محرم|صفر|ربيع|جمادى|رجب|شعبان|رمضان|شوال|ذو|أكتوبر|ديسمبر|سبتمبر|فبراير|نوفمبر|أبريل|أغسطس|يناير|يولية|يوليه|يوليو|يونية|يونيه|يونيو|مارس|مايو))': '1 شهر'
    - '(?<=(قبل|منذ)\s+)سنة\b(?!\s+ال)': '1 سنة'
    # Not before "ال": "يوم الجمعة" is a weekday ("Friday"), not "a day"
    - '(?<=(قبل|منذ)\s+)يوم\b(?!\s+ال)': '1 يوم'
    - '(?<=(قبل|منذ)\s+)ساعة\b(?!\s+ال)': '1 ساعة'
    - '(?<=(قبل|منذ)\s+)دقيقة\b(?!\s+ال)': '1 دقيقة'
    - '(?<=(قبل|منذ)\s+)ثانية\b(?!\s+ال)': '1 ثانية'
