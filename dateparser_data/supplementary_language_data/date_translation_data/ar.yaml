locale_specific:
    ar-IQ:
        october:
            - تشرین الأول
sentence_splitter_group: 6

skip: ["الساعة", "في", "مساءً", "هـ"]

june:
    - يونيه
    - يونية
july:
    - يوليه
    - يولية

monday:
    - الإثنين
friday:
    - الجمعه

year:
    - عام
    - سنة
    - السنه
month:
    - شهر
week:
    - أسبوع
day:
    - أيام
hour:
    - ساعة
    - ساعات
minute:
    - دقيقة
    - دقائق
second:
    - ثانية
    - ثانيه

ago:
    - منذ
    - مضت
in:
    - خلال

am:
    - صباحاً

relative-type:
    1 day ago:
        - اليوم السابق
        - الأمس
    2 day:
        - يومين
    2 hour:
        - ساعتين
    1 hour ago:
        - ساعة واحدة

simplifications:
    # The numeral "1" is optional: a bare unit means "1 unit" ago
    - '(?<=(قبل|منذ)\s+)أسبوع\b': '1 أسبوع'
    - '(?<=(قبل|منذ)\s+)شهر\b': '1 شهر'
    - '(?<=(قبل|منذ)\s+)سنة\b': '1 سنة'
    # Not before "ال": "يوم الجمعة" is a weekday ("Friday"), not "a day"
    - '(?<=(قبل|منذ)\s+)يوم\b(?!\s+ال)': '1 يوم'
    - '(?<=(قبل|منذ)\s+)ساعة\b': '1 ساعة'
    - '(?<=(قبل|منذ)\s+)دقيقة\b': '1 دقيقة'
    - '(?<=(قبل|منذ)\s+)ثانية\b': '1 ثانية'
