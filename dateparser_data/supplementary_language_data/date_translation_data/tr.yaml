simplifications:
    # "saat" is also the word for "hour", so drop it before a clock time
    # ("dün saat 14:00" means "yesterday at 14:00", not "14:00 hours").
    - saat (\d{1,2}[:.]\d{2}): \1
    # Locative suffix on a clock time: 14:00'te, 9:30'da
    - (\d{1,2}[:.]\d{2})'?[dt][ae]: \1
    - yarım saat: 30 dakika
    # Units first, then tens: "on beş" -> "on 5" -> "15"
    - bir: '1'
    - iki: '2'
    - üç: '3'
    - dört: '4'
    - beş: '5'
    - altı: '6'
    - yedi: '7'
    - sekiz: '8'
    - dokuz: '9'
    - on (\d): 1\1
    - yirmi (\d): 2\1
    - otuz (\d): 3\1
    - kırk (\d): 4\1
    - elli (\d): 5\1
    - on: '10'
    - yirmi: '20'
    - otuz: '30'
    - kırk: '40'
    - elli: '50'
