pertain: ['lúc']

sentence_splitter_group : 1

monday:
    - Thứ 2
tuesday:
    - Thứ 3
wednesday:
    - Thứ 4
thursday:
    - Thứ 5
friday:
    - Thứ 6
saturday:
    - Thứ 7
sunday:
    - Thứ 1

january:
    - Tháng một
february:
    - Tháng hai
march:
    - Tháng ba
april:
    - Tháng tư
may:
    - Tháng năm
june:
    - Tháng sáu
july:
    - Tháng bảy
august:
    - Tháng tám
september:
    - Tháng chín
october:
    - Tháng mười
november:
    - Tháng mười một
december:
    - Tháng mười hai

month:
    - thang
    - Thg
week:
    - tuần lể
day:
    - ban ngày
    - buổi
minute:
    - chút
    - lát
    - nguyên bản
second:
    - giây đồng hồ
    - hạng nhì

relative-type:
    in 1 week:
        - tuần tới
    in 1 month:
        - tháng tới
    in 1 year:
        - năm tới

relative-type-regex:
    in \1 second:
        - (\d+[.,]?\d*) giây sau
        - (\d+[.,]?\d*) giây nữa
        - sau (\d+[.,]?\d*) giây
    in \1 minute:
        - (\d+[.,]?\d*) phút sau
        - (\d+[.,]?\d*) phút nữa
        - sau (\d+[.,]?\d*) phút
    in \1 hour:
        - (\d+[.,]?\d*) giờ sau
        - (\d+[.,]?\d*) giờ nữa
        - sau (\d+[.,]?\d*) giờ
    in \1 day:
        - (\d+[.,]?\d*) ngày sau
        - (\d+[.,]?\d*) ngày nữa
        - sau (\d+[.,]?\d*) ngày
    in \1 week:
        - (\d+[.,]?\d*) tuần sau
        - (\d+[.,]?\d*) tuần nữa
        - sau (\d+[.,]?\d*) tuần
    in \1 month:
        - (\d+[.,]?\d*) tháng sau
        - (\d+[.,]?\d*) tháng nữa
        - sau (\d+[.,]?\d*) tháng
    in \1 year:
        - (\d+[.,]?\d*) năm sau
        - (\d+[.,]?\d*) năm nữa
        - sau (\d+[.,]?\d*) năm

ago:
    - cách đây
    - trước đây
    - trước
    - trước
in:
    - trong

simplifications:
    - (?:ngày|năm)\s(\d+[.,]?\d*): \1
    # Zero-padded months ("tháng 09", "thg 09") are rewritten to the forms
    # listed above instead of being listed as aliases: an alias would make the
    # numeral "09" a word of this language, and numerals are in every date.
    - (\d*)(tháng|thg) 0([1-9]): \1\2 \3
