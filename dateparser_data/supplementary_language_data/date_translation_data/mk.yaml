tuesday:
    - вт
september:
    - септ
november:
    - ноем
am:
    - претпладне
pm:
    - попладне
relative-type:
    1 year ago:
        - минатата година
    in 1 year:
        - следната година

simplifications:
    # The numeral "1" is optional: a bare unit means "1 unit" ago. Not
    # before another word or a number: "пред час по математика" (before a
    # math class) and "пред ден 5" are not "1 hour/day ago". This also
    # covers a month name after "месец" without needing to list them
    - '(?<=пред\s+)седмица\b(?!\s+\S)': '1 седмица'
    - '(?<=пред\s+)месец\b(?!\s+\S)': '1 месец'
    - '(?<=пред\s+)година\b(?!\s+\S)': '1 година'
    - '(?<=пред\s+)ден\b(?!\s+\S)': '1 ден'
    - '(?<=пред\s+)час\b(?!\s+\S)': '1 час'
    - '(?<=пред\s+)минута\b(?!\s+\S)': '1 минута'
