tuesday:
    - вт
september:
    - септ
november:
    - ноем
am:
    - претпладне
pm:
    - попладне
relative-type:
    1 year ago:
        - минатата година
    in 1 year:
        - следната година

simplifications:
    # The numeral "1" is optional: a bare unit means "1 unit" ago
    - '(?<=пред\s+)седмица\b': '1 седмица'
    - '(?<=пред\s+)месец\b(?!\s+(?:септември|декември|октомври|февруари|ноември|јануари|август|април|март|ноем|септ|јули|јуни|авг|апр|дек|мар|мај|ное|окт|сеп|фев|јан|јул|јун))': '1 месец'
    - '(?<=пред\s+)година\b': '1 година'
    - '(?<=пред\s+)ден\b': '1 ден'
    - '(?<=пред\s+)час\b': '1 час'
    - '(?<=пред\s+)минута\b': '1 минута'
