skip: ["about", "ad", "and", "at", "by", "from", "just", "m", "nd", "of", "on", "rd", "st", "th", "the"]
pertain: ["of"]

sentence_splitter_group : 1

monday:
    - mo

tuesday:
    - tu
    - Tues

wednesday:
    - we

thursday:
    - th

friday:
    - fr

saturday:
    - sa

sunday:
    - su

september:
    - sept

century:
    - century
    - centuries
decade:
    - decade
    - decades
fortnight:
    - fortnight
    - fortnights
year:
    - y
    - years
month:
    - months
week:
    - weeks
day:
    - d
    - days
hour:
    - h
    - hours
    - hrs
minute:
    - m
    - minutes
    - mins
second:
    - s
    - seconds
    - secs

early_morning:
    - early morning
    - small hours
    - wee hours
morning:
    - morning
afternoon:
    - afternoon
evening:
    - evening
night:
    - night

ago:
    - ago
    - before
in:
    - in
    - from now
    - after

relative-type:
    2 day ago:
        - day before yesterday
    1 century ago:
        - last century
        - this century
    in 1 century:
        - next century
    1 decade ago:
        - last decade
        - this decade
    in 1 decade:
        - next decade
    1 fortnight ago:
        - last fortnight
        - this fortnight
    in 1 fortnight:
        - next fortnight
    in 2 day:
        - day after tomorrow
    0 day ago:
        - till date

relative-type-regex:
    in \1 week:
        - in {0} weeks time
        - "in {0} weeks' time"
    in \1 century:
        - in (\d+[.,]?\d*) century
        - in (\d+[.,]?\d*) centuries
    \1 century ago:
        - (\d+[.,]?\d*) century ago
        - (\d+[.,]?\d*) centuries ago
    in \1 decade:
        - in (\d+[.,]?\d*) decades?
    \1 decade ago:
        - (\d+[.,]?\d*) decades? ago
    in \1 fortnight:
        - in (\d+[.,]?\d*) fortnights?
    \1 fortnight ago:
        - (\d+[.,]?\d*) fortnights? ago

simplifications:
    - (\d+[.,]?\d*)\s*mons?\b: \1 month
    - an: '1'
    - a: '1'
    - (?:12\s+)?noon: '12:00'
    - (?:12\s+)?midnight: '00:00'
    - tonight: today night
    - last night: yesterday night
    - this ((?:early )?morning|afternoon|evening|night): today \1
    - in the ((?:early )?morning|afternoon|evening|night|small hours|wee hours): \1
    - (\d+[.,]?\d*)h(\d+[.,]?\d*): \1:\2
    - from\s+now: in
    - less than 1 minute ago: 45 second ago
    - (\d+(?:st|nd|rd|th)) day: \1
    - (\d+[.,]?\d*|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve) (centur(?:y|ies)|decade|fortnight|year|month|week|day|hour|minute|second)s? later: in \1 \2
    - one: '1'
    - two: '2'
    - three: '3'
    - four: '4'
    - five: '5'
    - six: '6'
    - seven: '7'
    - eight: '8'
    - nine: '9'
    - ten: '10'
    - eleven: '11'
    - twelve: '12'

locale_specific:
    en-US:
        name: en-US
        date_order: MDY
