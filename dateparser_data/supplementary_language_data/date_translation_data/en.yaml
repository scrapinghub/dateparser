skip: ["about", "ad", "and", "at", "by", "from", "just", "m", "nd", "of", "on", "rd", "st", "th", "the"]
pertain: ["of"]

sentence_splitter_group : 1

monday:
    - mo

tuesday:
    - tu
    - Tues

wednesday:
    - we

thursday:
    - th

friday:
    - fr

saturday:
    - sa

sunday:
    - su

september:
    - sept

decade:
    - decade
    - decades
year:
    - y
    - years
month:
    - months
week:
    - weeks
day:
    - d
    - days
hour:
    - h
    - hours
    - hrs
minute:
    - m
    - minutes
    - mins
second:
    - s
    - seconds
    - secs

ago:
    - ago
    - before
in:
    - in
    - from now
    - after

relative-type:
    2 day ago:
        - day before yesterday
    1 decade ago:
        - last decade
        - this decade
    in 1 decade:
        - next decade
    in 2 day:
        - day after tomorrow
    0 day ago:
        - till date
    # "this <weekday>" is supplied here rather than from CLDR, where in many
    # locales it is identical to the bare weekday name (#573). "past <weekday>"
    # is a common English synonym of "last <weekday>" that CLDR does not carry.
    this monday:
        - this monday
    this tuesday:
        - this tuesday
    this wednesday:
        - this wednesday
    this thursday:
        - this thursday
    this friday:
        - this friday
    this saturday:
        - this saturday
    this sunday:
        - this sunday
    last monday:
        - past monday
    last tuesday:
        - past tuesday
    last wednesday:
        - past wednesday
    last thursday:
        - past thursday
    last friday:
        - past friday
    last saturday:
        - past saturday
    last sunday:
        - past sunday

relative-type-regex:
    in \1 week:
        - in {0} weeks time
        - "in {0} weeks' time"
    in \1 decade:
        - in (\d+[.,]?\d*) decades?
    \1 decade ago:
        - (\d+[.,]?\d*) decades? ago

simplifications:
    - (\d+[.,]?\d*)\s*mons?\b: \1 month
    - an: '1'
    - a: '1'
    - (?:12\s+)?noon: '12:00'
    - (?:12\s+)?midnight: '00:00'
    - (\d+[.,]?\d*)h(\d+[.,]?\d*): \1:\2
    - from\s+now: in
    - less than 1 minute ago: 45 second ago
    - (\d+[.,]?\d*|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve) (decade|year|month|week|day|hour|minute|second)s? later: in \1 \2
    - one: '1'
    - two: '2'
    - three: '3'
    - four: '4'
    - five: '5'
    - six: '6'
    - seven: '7'
    - eight: '8'
    - nine: '9'
    - ten: '10'
    - eleven: '11'
    - twelve: '12'

locale_specific:
    en-US:
        name: en-US
        date_order: MDY
