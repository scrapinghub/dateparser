skip: ["about", "ad", "and", "at", "by", "from", "just", "m", "nd", "of", "on", "rd", "st", "th", "the"]
pertain: ["of"]

sentence_splitter_group : 1

monday:
    - mo

tuesday:
    - tu
    - Tues

wednesday:
    - we

thursday:
    - th

friday:
    - fr

saturday:
    - sa

sunday:
    - su

september:
    - sept

decade:
    - decade
    - decades
year:
    - y
    - years
month:
    - months
week:
    - weeks
day:
    - d
    - days
hour:
    - h
    - hours
    - hrs
minute:
    - m
    - minutes
    - mins
second:
    - s
    - seconds
    - secs

ago:
    - ago
    - before
in:
    - in
    - from now
    - after

relative-type:
    2 day ago:
        - day before yesterday
    1 decade ago:
        - last decade
        - this decade
    in 1 decade:
        - next decade
    in 2 day:
        - day after tomorrow
    0 day ago:
        - till date

relative-type-regex:
    in \1 week:
        - in {0} weeks time
        - "in {0} weeks' time"
    in \1 decade:
        - in (\d+[.,]?\d*) decades?
    \1 decade ago:
        - (\d+[.,]?\d*) decades? ago

simplifications:
    - (\d+[.,]?\d*)\s*mons?\b: \1 month
    - an: '1'
    - a: '1'
    - (?:12\s+)?noon: '12:00'
    - (?:12\s+)?midnight: '00:00'
    - (\d+[.,]?\d*)h(\d+[.,]?\d*): \1:\2
    - from\s+now: in
    - less than 1 minute ago: 45 second ago
    - one: '1'
    - two: '2'
    - three: '3'
    - four: '4'
    - five: '5'
    - six: '6'
    - seven: '7'
    - eight: '8'
    - nine: '9'
    - ten: '10'
    - eleven: '11'
    - twelve: '12'
    - thirteen: '13'
    - fourteen: '14'
    - fifteen: '15'
    - sixteen: '16'
    - seventeen: '17'
    - eighteen: '18'
    - nineteen: '19'
    - twenty[ -]([1-9]): 2\1
    - thirty[ -]([1-9]): 3\1
    - forty[ -]([1-9]): 4\1
    - fifty[ -]([1-9]): 5\1
    - sixty[ -]([1-9]): 6\1
    - seventy[ -]([1-9]): 7\1
    - eighty[ -]([1-9]): 8\1
    - ninety[ -]([1-9]): 9\1
    - twenty: '20'
    - thirty: '30'
    - forty: '40'
    - fifty: '50'
    - sixty: '60'
    - seventy: '70'
    - eighty: '80'
    - ninety: '90'
    - (\d+[.,]?\d*) (decade|year|month|week|day|hour|minute|second)s? later: in \1 \2

locale_specific:
    en-US:
        name: en-US
        date_order: MDY
