no_word_spacing: "True"

sentence_splitter_group : 4

skip: ["约"]

monday:
    - 礼拜一
tuesday:
    - 礼拜二
wednesday:
    - 礼拜三
thursday:
    - 礼拜四
friday:
    - 礼拜五
saturday:
    - 礼拜六
sunday:
    - 星期天
    - 礼拜日
    - 礼拜天

month:
    - 个月
    - 個月
week:
    - 星期
day:
    - 天

ago:
    - 前
in:
    - 在

relative-type:
    2 day ago:
        - 前天
    0 second ago:
        - 刚刚
    0 hour ago:
        - 这一时间
        - 此时
    in 2 days:
        - 后天

simplifications:
    - 半小时前: 30分前
    - (?:中午|下午|(?:晚上?))(?:\s*)(\d+[.,]?\d*)(?:\s*):(?:\s+|:)?(\d+[.,]?\d*(?::\d+[.,]?\d*)?): \1:\2 pm
    - (?:上午|早上|凌晨)(?:\s*)(\d+[.,]?\d*)(?:\s*):(?:\s+|:)?(\d+[.,]?\d*(?::\d+[.,]?\d*)?): \1:\2 am
    - 中午: '12:00'
    - (\d+[.,]?\d*)\s*年\s*(\d+[.,]?\d*)\s*月\s*(\d+[.,]?\d*)\s*日\s*(\d+[.,]?\d*)\s*时\s*(\d+[.,]?\d*)\s*分: \1-\2-\3 \4:\5
    - (\d+[.,]?\d*)\s*年\s*(\d+[.,]?\d*)\s*月\s*(\d{1,2})\s*(?:日)?\s*(\d{1,2})\s*(?:点|:)\s*(\d{1,2}): \1-\2-\3 \4:\5
    - (\d+[.,]?\d*)\s*年\s*(\d+[.,]?\d*)\s*月\s*(\d{1,2})\s*(?:日)?: \1-\2-\3
    - (\d+[.,]?\d*)月(?=.*[前后]): \1 月
