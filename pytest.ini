[pytest]
testpaths = tests
# Warnings are errors: warning-class problems have repeatedly reached users
# instead of CI (#1246, #1013, #506). The suite emits no warnings at all today,
# so the list below starts with no exemptions. When an upstream deprecation
# turns the suite red, fix it if it comes from dateparser, and otherwise add the
# narrowest possible ignore *after* `error`, since the last matching filter wins.
filterwarnings =
    error
